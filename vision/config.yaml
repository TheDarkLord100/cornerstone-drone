# health_monitor:
#   heartbeat_timeout: 2.0
#   max_vision_lag: 0.5
#   max_depth_age: 1.0
#   min_fps: 5.0

terrain_map:
  map_size_m: 20.0        # square map side length in metres
  resolution: 0.1         # metres per cell → 200×200 grid
  depth_scale: 0.001      # convert raw uint16 to metres (typical for RealSense/Gazebo)
  flatness_threshold: 0.04 # depth std dev (m) below which a cell is considered flat
  min_points: 5           # minimum depth hits before a cell is marked
  cloud_max_points: 50000 # downsample accumulated cloud to this many points
  publish_rate_hz: 2.0    # how often to publish occupancy grid + cloud